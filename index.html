<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  
  <!-- СЛОЙ 0: Нейтральный фон -->
  <rect width="100%" height="100%" fill="#D2CFC8" />

  <!-- СЛОЙ 1: Тело (Руки и майка слиты в единый силуэт) -->
  <!-- Плечи сильно скошены, талия слегка сужена, руки спускаются вниз -->
  <path d="M 90,700 
           C 85,550 100,450 115,410 
           C 130,360 160,300 200,280 
           C 220,270 280,270 300,280 
           C 340,300 370,360 385,410 
           C 400,450 415,550 410,700 Z" 
        fill="#EFECE7" />

  <!-- СЛОЙ 1.1: Разделение рукавов и рук (цветом фона, без грубых контуров) -->
  <!-- Левая сторона -->
  <path d="M 115,410 C 125,415 140,415 145,400 C 135,500 135,600 140,700" 
        fill="none" stroke="#D2CFC8" stroke-width="4" stroke-linecap="round"/>
  <!-- Правая сторона -->
  <path d="M 385,410 C 375,415 360,415 355,400 C 365,500 365,600 360,700" 
        fill="none" stroke="#D2CFC8" stroke-width="4" stroke-linecap="round"/>

  <!-- СЛОЙ 2: Волосы -->
  <!-- Округлая макушка, плавное расширение на плечах и ровный, но слегка волнистый срез внизу -->
  <path d="M 250,45 
           C 180,45 150,100 145,180 
           C 140,250 125,400 130,670 
           Q 150,685 190,680 
           Q 220,685 250,680 
           Q 280,685 310,680 
           Q 350,685 370,670 
           C 375,400 360,250 355,180 
           C 350,100 320,45 250,45 Z" 
        fill="#150B07" />
        
</svg>
